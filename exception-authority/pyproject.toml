[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exception-authority"
version = "0.1.0"
description = "Minimal-pair test of whether LLM agents check an authentic issuer's power to make a rule, with a spending-guarded runner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.9",
    "openai>=3.52",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
